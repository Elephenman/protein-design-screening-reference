5–2026 前沿默认链（选型，不是阈值）", "h3": "", "kind": "para", "text": "来源为官方仓库/model card 与一手论文，逐条取证级别见 前沿方法核验清单。", "rows": [], "header": []}, {"h2": "F. 2025–2026 前沿默认链（选型，不是阈值）", "h3": "", "kind": "list", "items": ["当前默认（2026-10-19 起）：RFD4-Proteina 序列–结构联合共设计，一个模型出序列与全原子结构，", "支持 motif/位点条件、partial diffusion 精修、reward-guided search [S21] [S22]。", "它把 v1 的\"骨架 → 序列 → 复折\"三件套压成\"共设计 → 复折核验\"，③ 因此降为复核步。", "门槛要如实说：Linux x86_64 + Python 3.12 + CUDA 13 兼容驱动，官方明写 macOS/Windows 不支持；", "flow model 与 autoencoder 是配对的，跨版本混用\"产出的是垃圾而不是报错\"（model card 原话）[S21]。", "退回路线：硬件或许可够不上时走 RFD3 → ProteinMPNN/LigandMPNN → RF3，这是 Baker/IPD 官方教程的默认三件套 [S1]。", "官方 RFO 优化循环里 Boltz-2 只是按概率切换的结构预测分支，README 原话 \"it does not rank the samples\"，", "不许读成\"官方把亲和力模型当筛子\"。库内对应 [B08] [B28] [B13] [B35]。", "算力数字的口径陷阱：RFD4 model card 的效率表（每 GPU-小时通过数）**自己声明是上一版权重在 2026-10-09", "冻结基准上测的、未在当前版本重测**，且\"计算通过者不代表实验活性\"[S21]。不许把它当本版本的产能规划依据。", "湿实验数字的口径陷阱（预印本正文，[S22]）：PTE 酶 89/288（31%）是测试池活性率，", "而严格计算筛只放行 15/1,000，从过筛池到 288 条下单的选取规则论文未给 → 引用必须带分母与这条缺口注记。", "同篇糖基化 8/9 被补充材料明写 \"campaign hit rates were not assessed\"（表征子集，不是命中率）；", "partial diffusion 救活 100/102 被明写 \"These outcomes are computational, not experimental binding measurements.\"。", "本文没有描述任何序贯多轮湿实验战役，只有跨代 spec 升级（RFD3 六残基 → RFD4 八残基 theozyme）、", "平行战役与文库内 FACS 排序轮；官方迭代建议是\"先做小规模 pilot 定推理配置\"。", "多轮迭代的真实轮次链因此取自库内 [B17] [B18] [B10]，见迭代协议 §1。", "抗体/纳米抗体：通用置信度指标近乎无效（AUC 0.5–0.6 [S5]），要用任务专用模型替换置信度排序", "（BoltzPPI 类把命中率 3.3%→8.0% [S7]），或直接走展示库 [B22] [B11]。", "酶设计：全原子约束 + 系综/预组织判据为主闸（PLACER 类 [B17] [B19]），2026 年出现\"96 构型零样本直接拿到", "活性催化剂\"（[S9]，库内 [B35] 是同一工作的预印本）与\"同骨架序列系综是主判据\"（[S17]）。", "亲和力数字：probability 头管二分（结合/不结合），log10(IC50) 头只管系列内排序，混用即错 [S3] [S4]；", "某系列一旦开始探索新亚口袋，ML 亲和力分数默认不可信——真实药化项目里实验活性提升 500× 而模型完全看不见 [S20]。", "禁用清单：六个方法名（RFSolo / DockDesign / MolGen / IG-LLM / LockMSF / PoseChains）", "截至 2026-11-07 在 EPMC、arXiv、Crossref、GitHub 四路索引未检得一手来源", "（未覆盖专利库、Google Scholar 与闭源内部代号）。模板里不许出现这些名字，也不许写成\"这些方法不存在\" [S0]。"], "rows": [], "header": []}, {"h2": "G. 防自欺六 fy_workflow_template.py --selftest # 三种破坏必须各红一条", "rows": [], "header": []}, {"h2": "J. 复现与门禁", "h3": "", "kind": "para", "text": "python scripts/build_workflow_evidence.py --check     # 台账行数必须等于从 CSV+卡重算的行数", "rows": [], "header": []}, {"h2": "J. 复现与门禁", "h3": "", "kind": "para", "text": "python scripts/verify_literature_cards.py             # 152/152，模板引用的底座", "rows": [], "header": []}, {"h2": "J. 复现与门禁", "h3": "", "kind": "para", "text": "模板里每个默认值都能顺着编号进卡（§3 方法工作流、§4 数字台账、§7 局限、§8 可迁移性），", "rows": [], "header": []}, {"h2": "J. 复现与门禁", "h3": "", "kind": "para", "text": "每个 S 号都能进 前沿方法核验清单 查到 URL、访问日期与取证级别。", "rows": [], "header": []}, {"h2": "J. 复现与门禁", "h3": "", "kind": "para", "text": "能证明 / 不能证明 / 尚缺什么：本模板能证明\"这套级联在别人的体系里把下单量压到百级并提高一个数量级成功率\"", "rows": [], "header": []}, {"h2": "J. 复现与门禁", "h3": "", "kind": "para", "text": "（[B09] [B08]）；不能证明\"照抄阈值到你的靶上会得到同样通过率\"（无一例外都是别人体系拟合的切点，[K31]）；", "rows": [], "header": []}, {"h2": "J. 复现与门禁", "h3": "", "kind": "para", "text": "尚缺的是本体系 ≥50 条带死活读数的设计记录 —— 在拿到它之前，§H 第七步的降级规则生效。", "rows": [], "header": []}]}, {"key": "iteration", "title": "多轮迭代", "file": "protein_design_workflow_iteration.md", "blocks": [{"h2": "", "h3": "", "kind": "para", "text": "# 多轮迭代协议（工作流模板 §B 的展开）", "rows": [], "header": []}, {"h2": "", "h3": "", "kind": "para", "text": "写于 2026-11-07。主模板 protein_design_workflow_template.md 的 §B 只放了阶梯，", "rows": [], "header": []}, {"h2": "", "h3": "", "kind": "para", "text": "这一页回答用户的问题：\"一般的研究都是要多轮迭代的，我们到底怎么迭代。\"", "rows": [], "header": []}, {"h2": "", "h3": "", "kind": "para", "text": "先说清这一页的性质：§1 是文献台账（每条带卡编号、分母与证据级别）；", "rows": [], "header": []}, {"h2": "", "h3": "", "kind": "para", "text": "§0 与 §2–§7 是我们的归纳与协议设计，不是文献结论。两者不许混读。", "rows": [], "header": []}, {"h2": "", "h3": "", "kind": "para", "text": "引用编号规则与主模板一致：[B..]/[K..] 进 证据台账，", "rows": [], "header": []}, {"h2": "", "h3": "", "kind": "para", "text": "[S..] 进 前沿方法核验清单。证据级别 P0–P5 定义见主模板 §I。", "rows": [], "header": []}, {"h2": "", "h3": "", "kind": "para", "text": "---", "rows": [], "header": []}, {"h2": "0. 为什么迭代才是主线，第一轮不是", "h3": "", "kind": "para", "text": "第一轮的作用是把本体系的死活读数拿到手，不是拿命中。三条库内证据支持这个定位：", "rows": [], "header": []}, {"h2": "0. 为什么迭代才是主线，第一轮不是", "h3": "", "kind": "list", "items": ["[K30]（Rocklin 2017 Science，摘要级 P1）：并行设计–合成–测试 >15,000 个从头 miniprotein，", "设计↔实验的迭代把成功率从 6% 提到 47%（稳定性代理读数）。**摘要没给轮数、每轮送测数、分母定义，", "也没说改了什么判据**，所以只能当\"闭环能提一个量级\"的量级锚点，不能当方法依据（§1.3）。", "[B18]（P0）：同一体系第一轮 1/96、第二轮 11/96，判定线是 k_cat/K_M >10³ M⁻¹s⁻¹，", "两轮的 96 都是排名截断的闸口形分母。零样本那一轮几乎全阴，第二轮才出东西（口径与 caveat 见 §1.1）。", "[S17]（AlphaProtein Novo，P3）：DEHP 降解首轮 81 条里 4 条高于背景 3 SD；两轮后新骨架 hit rate 11%、", "回收骨架 39%（命中定义 = 活性 ≥ 对照天然酶 QHH21706.1 的 2%）。作者明示各反应 hit rate 定义不同，不许跨反应比较。"], "rows": [], "header": []}, {"h2": "0. 为什么迭代才是主线，第一轮不是", "h3": "", "kind": "para", "text": "反过来也要说清：台账里\"第二轮优于第一轮\"的例子不止一条（[B17] [B18] [B05] [B33] [B44] [B24]），", "rows": [], "header": []}, {"h2": "0. 为什么迭代才是主线，第一轮不是", "h3": "", "kind": "para", "text": "但没有一条是对你的体系的保证——其中只有 [B17] 的 r1/r2 是\"只差一道筛子\"的受控对照，", "rows": [], "header": []}, {"h2": "0. 为什么迭代才是主线，第一轮不是", "h3": "", "kind": "para", "text": "其余各轮都同时改了两三件事，作者自己也只给推测性归因。", "rows": [], "header": []}, {"h2": "0. 为什么迭代才是主线，第一轮不是", "h3": "", "kind": "para", "text": "所以本协议不承诺提升幅度，只规定\"怎么迭代才不会白跑一轮\"。", "rows": [], "header": []}, {"h2": "0. 为什么迭代才是主线，第一轮不是", "h3": "", "kind": "para", "text": "---", "rows": [], "header": []}, {"h2": "1. 案例台账：真实发生过的轮次序列", "h3": "", "kind": "para", "text": "台账底稿：iteration_evidence_2026-11-07.md（2026-11-07 产出，", "rows": [], "header": []}, {"h2": "1. 案例台账：真实发生过的轮次序列", "h3": "", "kind": "para", "text": "逐条附卡文件名、原句摘录、证据级别与 引句底稿: 声明）。本节是它的可读版；要核某个数字，", "rows": [], "header": []}, {"h2": "1. 案例台账：真实发生过的轮次序列", "h3": "", "kind": "para", "text": "先查台账 → 进卡 §4 数字台账 / §9 溯源 → 最后进卡声明的单一底稿逐字比对。", "rows": [], "header": []}, {"h2": "1. 案例台账：真实发生过的轮次序列", "h3": "", "kind": "para", "text": "读法（三条硬口径，违反就会把台账读成假曲线）：", "rows": [], "header": []}, {"h2": "1. 案例台账：真实发生过的轮次序列", "h3": "", "kind": "list", "items": ["每个百分 。不满足时判据只能排序，淘汰交给湿实验（主模板 §H 第 7 步）。", "rows": [], "header": []}, {"h2": "3. 三轴分离：一轮只动一个轴", "h3": "3.2 判据轴：什么时候才允许动筛子", "kind": "para", "text": "满足之后，按主模板 §H 七步走。这里只补三条迭代特有的：", "rows": [], "header": []}, {"h2": "3. 三轴分离：一轮只动一个轴", "h3": "3.2 判据轴：什么时候才允许动筛子", "kind": "list", "items": ["切点在训练集拟合、在留出集报告。[K31] 的六个切点（pTM 0.8、界面 pLDDT 84、IRAD −128、", "Rosetta 跨界面结合能 −16、ipTM≈0.75）是在同一批 149 例上按 sensitivity+specificity 最大化挑的，", "没有留出集，多分类 AUC 只有 0.77–0.84。这就是\"看起来能用、其实是过拟合\"的标准样本。", "换判据族比调切点更值钱。酶体系里静态 AF2 闸口过了也不会催化，必须接系综/预组织检验", "（[B17] [B19]；[S17] 明写主判据是\"同骨架派生的序列系综\"）。", "[S13]（CaGE）更进一步：把 RF3 再训练成设计条件网络，多轮衰减约束，交替\"约束引导结构预测 → LigandMPNN 重设计\"；", "作者同时点明复杂约束下\"内部一致的设计占比可低到计算不可负担\"——单轮生成+置信度筛选在复杂活性位会失败。", "有本靶标数据后才微调模型。[S19]：用片段筛选阶段的晶体结构微调 OpenFold3-p2，可改善后续位姿与虚拟筛选；", "[S10]：有 ≥40–300 条本靶标活性标签后微调亲和力头重排 top 10%。", "无标签时不要指望亲和力头，而且 probability 头管二分、log10(IC50) 头只管系列内排序，混用即错（[S3] [S4]）。", "跨系列更危险：真实药化项目里实验活性提升 500× 而 ML 分数完全看不见（[S20]）。"], "rows": [], "header": []}, {"h2": "3. 三轴分离：一轮只动一个轴", "h3": "3.3 路线轴：什么时候该认输换打法", "kind": "para", "text": "触发条件（任一成立）：", "rows": [], "header": []}, {"h2": "3. 三轴分离：一轮只动一个轴", "h3": "3.3 路线轴：什么时候该认输换打法", "kind": "list", "items": ["首轮 96 孔批次 <2 个可重复命中（主模板 §C 的 G2）→ 不许先改阈值，先换位点或换路线。", "体系落在已知失灵域：抗体/VHH/CDR（[B22] 逐靶实验成功率 0%–2%；[K31] 抗体子集 0/11；", "[S5] 通用置信度 ROC-AUC 0.5–0.6）→ 直接走展示库（[B11] 一次 ~9,000 设计/靶）。", "判据通过率 >50% 或 <0.5%（G1）→ 判据没在筛，或位点/骨架质量有问题。"], "rows": [], "header": []}, {"h2": "3. 三轴分离：一轮只动一个轴", "h3": "3.3 路线轴：什么时候该认输换打法", "kind": "para", "text": "换路线的代价要先算：展示库日历约 6 周，E. coli+SPR 约 2 周（自寡核苷酸下单起，[B22]）。", "rows": [], "header": []}, {"h2": "3. 三轴分离：一轮只动一个轴", "h3": "3.3 路线轴：什么时候该认输换打法", "kind": "para", "text": "免纯化微流控（FIDA）可在表达后约 1 天定初筛命中，但依赖 ΔR_h，需先由预测复合物估 R_h（误差 ~9%，[K06]）。", "rows": [], "header": []}, {"h2": "3. 三轴分离：一轮只动一个轴", "h3": "3.3 路线轴：什么时候该认输换打法", "kind": "para", "text": "测序式并行读出（MP3-seq）一次 >10⁵ 对，但最大全对全里 914 对强信号中仅 33 对是设计意图（约 3.6%），", "rows": [], "header": []}, {"h2": "3. 三轴分离：一轮只动一个轴", "h3": "3.3 路线轴：什么时候该认输换打法", "kind": "para", "t 定推理配置（这是官方建议，不是战役记录）", "kind": "para", "text": "只在难任务上划算（酶包埋 +22.6%、小分子多相互作用 +24.6%，[S22]）。", "rows": [], "header": []}, {"h2": "3. 三轴分离：一轮只动一个轴", "h3": "3.4 用 RFD4 时的第 0 轮：pilot 定推理配置（这是官方建议，不是战役记录）", "kind": "para", "text": "---", "rows": [], "header": []}, {"h2": "4. 分支-specific 的第二轮", "h3": "", "rows": [{"cells": ["binder / 抑制剂", "命中位点的突变扫描 + 亲和力成熟；抗体类直接转展示库", "不要在抗体体系继续调 ipTM 切点", "[B24] [B22]；[S7] 任务专用模型 3.3%→8.0%"], "p": "", "cites": ["B24", "B22", "S7"]}, {"cells": ["酶 / 催化", "系综/预组织判据 + 定向进化；机理解释用 MD/QM/MM", "不要把 MD 当筛子；不要用 pAE/ipTM 判活性", "[B17] [B19] [S13] [S17]；[S14] MD 的位置是解释设计–进化差距"], "p": "", "cites": ["B17", "B19", "S13", "S17", "S14"]}, {"cells": ["肽 / 大环", "**先补合成与环化产率**，再谈亲和力", "不要先加算力", "[B15] 27 条合成里 13 条、11 条里 3 条因环化产率不足被剔"], "p": "", "cites": ["B15"]}], "kind": "table", "header": ["分支", "第二轮第一笔钱花在哪", "不要花在哪", "依据"]}, {"h2": "4. 分支-specific 的第二轮", "h3": "", "kind": "para", "text": "酶分支还要抄一条负面发现：[S15] 两轮定向进化到高催化效率，但作者明写", "rows": [], "header": []}, {"h2": "4. 分支-specific 的第二轮", "h3": "", "kind": "para", "text": "\"the initial design considered only the transition state but not substrate binding, leading to a dynamic Michaelis complex\"。", "rows": [], "header": []}, {"h2": "4. 分支-specific 的第二轮", "h3": "", "kind": "para", "text": "→ 第二轮要检查底物结合，不是只看过渡态几何。 [S12] 同向：多态（沿整条反应坐标）约束设计的最佳变体，", "rows": [], "header": []}, {"h2": "4. 分支-specific 的第二轮", "h3": "", "kind": "para", "text": "双底物效率比单态设计高 >100×。", "rows": [], "header": []}, {"h2": "4. 分支-specific 的第二轮", "h3": "", "kind": "para", "text": "---", "rows": [], "header": []}, {"h2": "5. T0 档（≤4 个湿实验构建体）怎么迭代", "h3": "", "kind": "para", "text": "这是我们自己的处境，也是本协议最容易被套错的一档。没有漏斗，就没有\"递减\"可迭代。", "rows": [], "header": []}, {"h2": "5. T0 档（≤4 个湿实验构建体）怎么迭代", "h3": "", "kind": "para", "text": "T0 档迭代的对象不是候选池，而是判据本身。", "rows": [], "header": []}, {"h2": "5. T0 档（≤4 个湿实验构建体）怎么迭代", "h3": "", "rows": [{"cells": ["R1", "量具", "建参照回收：先在**已知阳性/阴性**的参照体系上跑同一套判据，看它能不能把已知答案分开", "参照回收率 + 阴性锚读数", "不许在候选上先跑判据再回头定切点"], "p": "", "cites": []}, {"cells": ["R2", "判据维度", "若 R1 分不开，换判据维度（几何 → 系综 → 电子结构），不是调同一维度的切点", "哪一维有方向信息的实测记录", "不许把\"占比 40–80%\"这类零假设读数当判据"], "p": "", "cites": []}, {"cells": ["R3", "机制假设", "只对 1–2 个候选做机制层单点计算（QM/xTB 级），解释而非筛选", "结构/机理假设 + 明确的可判伪预测", "不许上 μs 级显式溶剂 MD 长采样当预筛"], "p": "", "cites": []}, {"cells": ["R4", "湿实验", "≤4 个构建体，每个都必须能证伪一个具体假设", "假设成立/不成立", "不许报命中率（分母太小，主模板 §D 的 T0 行）"], "p": "", "cites": []}], "kind": "table", "header": ["轮", "迭代对象", "做什么", "产出", "不许做什么"]}, {"h2": "5. T0 档（≤4 个湿实验构建体）怎么迭代", "h3": "", "kind": "para", "text": "依据与代价：[K27]（P4 推算）N=100 时每候选 200 ns 显式溶剂 MD 约 2,650 GPU·天，", "rows": [], "header": []}, {"h2": "5. T0 档（≤4 个湿实验构建体）怎么迭代", "h3": "", "kind": "para", "text": "比同期湿实验（$500–5,000）贵约两个数量级；[K34] 端态法在 PDBbind 上与实验值几乎不相关。", "rows": [], "header": []}, {"h2": "5. T0 档（≤4 个湿实验构建体）怎么迭代", "h3": "", "kind": "para", "text": "→ T0 档的算力应该花在\"能解释一个具体化学事件\"上，不是花在\"给候选排序\"上。", "rows": [], "header": []}, {"h2": "5. T0 档（≤4 个湿实验构建体）怎么迭代", "h3": "", "kind": "para", "text": "T0 档的 stopping rule 也更严：参照回收不过，就停在 R1，不许进 R4。", "rows": [], "header": []}, {"h2": "5. T0 档（≤4 个湿实验构建体）怎么迭代", "h3": "", "kind": "para", "text": "拿 4 个构建体去测一个连已知阳性都分不开的判据，等于把唯一的实验预算花在无法解释的读数上。", "rows": [], "header": []}, {"h2": "5. T0 档（≤4 个湿实验构建体）怎么迭代", "h3": "", "kind": "para", "text": "---", "rows": [], "header": []}, {"h2": "6. 多轮战役怎么报数（这一节最容易被违反）", "h3": "", "kind": "list", "items": ["每轮一个分母，不许累计。第 2 轮的命中率分母是\"第 2 轮下单数\"。", "要报累计就单独列一行并写明\"两轮累计下单 N\"，不与逐轮数混排。", "零样本轮与成熟轮分开列。[B18] 的 1/96 与 11/96 是同一体系两轮、同一条判定线（k_cat/K_M >10³ M⁻¹s⁻¹），", "这种才可比；[B17] 的 1.6% / 5.2% / 1.5% 是三种不同读数，不可比（§1.1）。", "[S17] 的 11%（新骨架）与 39%（回收骨架）是同轮内两个子集，不是两轮，别读成\"第二轮涨到 39%\"。", "计算口径与湿实验口径分表。[B23] 的 in silico 通过率 0.98%→9.2% 是条件化改动带来的计算提升，", "同篇实验侧仍 <1%；[B20] 的 41/41 是复折自洽，同篇湿实验是 4/96、3/96、5/96、11/96（96 为闸口形分母）。", "自选表征子集要标出来。[B11] 的\"约 90% 对约 30%\"两个分母都是自选表征子集，不可当提升倍数引用。", "阈值变动要跟着数字走。[B12] 每批改阈值、[B14] pAE 线在 <20/<5/<7 之间切换 →", "引用它们的通过率时必须同时引当轮切点，否则数字不可比。", "不许把命中率与成本合成\"性价比指标\"（[K24] [K26] 明令禁止）。"], "rows": [], "header": []}, {"h2": "6. 多轮战役怎么报数（这一节最容易被违反）", "h3": "", "kind": "para", "text": "---", "rows": [], "header": []}, {"h2": "7. 停止与换题", "h3": "", "kind": "para", "text": "主模板 §C 的三条停止条件在每轮收尾都要过一遍。迭代特有的两条补充：", "rows": [], "header": []}, {"h2": "7. 停止与换题", "h3": "", "kind": "list", "items": ["两轮完整迭代后判定线仍未达标，且判据 ROC 建不起来 → 停止，结论写\"该位点在当前判据体系下不可设计\"，", "失败库归档（[B23] 的做法）。这不是失败，这是一个可发表的阴性结论。", "连续两轮都只能动判据轴、候选轴无从下手（例如全部候选连表达都没有）→ 问题在 ①/② 不在 ④，", "回主模板 §A 的 ① 重新定靶/位点，别继续在筛子上加层。"], "rows": [], "header": []}, {"h2": "7. 停止与换题", "h3": "", "kind": "para", "text": "能证明 / 不能证明 / 尚缺什么：", "rows": [], "header": []}, {"h2": "7. 停止与换题", "h3": "", "kind": "list", "items": ["能证明：库内存在多次真实的多轮迭代，且第二轮读数优于第一轮——[B18] 1/96→11/96（同判定线 >10³ M⁻¹s⁻¹）、", "[B17] r1/r2 1.6%→5.2%（受控对照，只差一道筛子）、[B05] 换序列器后 73/96 可溶、[B33] 54 对里 16 条显著优于 r1、", "[B44] 晶体导向重采样后终分子 0.11 nM、[B24] cb4 组 33/58 高于 cb13 组 19/58。以上均带分母，见 §1。", "不能证明：照这套阶梯迭代你的体系也会涨同样幅度。除 [B17] r1/r2 外各轮都同时改了两三件事，", "归因不干净；[K30] 的 6%→47% 是摘要级、分母定义缺失，只能当量级锚点。", "尚缺什么：我们自己的第一轮标签。在 campaign_results.tsv 有 ≥50 行本体系\"下单→死活读数\"记录之前，", "判据轴按主模板 §H 第 7 步降级为排序用途，不许用于淘汰。"], "rows": [], "header": []}]}, {"key": "binder", "title": "分支 A · 结合体", "file": "protein_design_workflow_template_branch_binder.md", "blocks": [{"h2": "", "h3": "", "kind": "para", "text": "# 分支 A · 结合体与抑制剂（binder / inhibitor）", "rows": [], "header": []}, {"h2": "", "h3": "", "kind": "para", "text": "主模板 protein_design_workflow_template.md 的分支参数页。", "rows": [], "header": []}, {"h2": "", "h3": "", "kind": "para", "text": "本页只写与主模板默认值不同或本分支特有的东西；冲突时以本页为准，本页没写的按主模板。", "rows": [], "header": []}, {"h2": "A.1 本分支的默认路线（有结构锚点时）", "h3": "", "kind": "para", "text": "位点(热斑/共晶) → RFD4-Proteina 共设计(序列+全原子) → 复合物复折主闸", "rows": [], "header": []}, {"h2": "A.1 本分支的默认路线（有结构锚点时）", "h3": "", "kind": "para", "text": "→ 96–5,000 下单 → 表达+SEC → 单点 BLI/SPR 或展示库 → 动力学(KD) → 可选结构确证", "rows": [], "header": []}, {"h2": "A.1 本分支的默认路线（有结构锚点时）", "h3": "", "kind": "para", "text": "↳ 第二轮起：命中做突变扫描/亲和力成熟，弱命中做 partial diffusion 精 h2": "2. 十个阶段各自怎么做", "h3": "③ 序列设计：一秒钟一条，批量出、按模型似然排序", "kind": "para", "text": "可用判据（[B05]）：native sequence recovery 52.4%（MPNN）对 32.9%（Rosetta）；", "rows": [], "header": []}, {"h2": "2. 十个阶段各自怎么做", "h3": "③ 序列设计：一秒钟一条，批量出、按模型似然排序", "kind": "para", "text": "救援实验里同一批 AF 幻觉骨架，AF 自序表达大多不溶（中位 9 mg/L），换 MPNN 序列后 96 个设计里", "rows": [], "header": []}, {"h2": "2. 十个阶段各自怎么做", "h3": "③ 序列设计：一秒钟一条，批量出、按模型似然排序", "kind": "para", "text": "73 个可溶（中位 247 mg/L）、50 个是目标寡聚态（SEC）。", "rows": [], "header": []}, {"h2": "2. 十个阶段各自怎么做", "h3": "③ 序列设计：一秒钟一条，批量出、按模型似然排序", "kind": "para", "text": "注意：[B05] 正文没给\"取前 N 条\"的数值阈值，也没给采样温度阈值 → 卡里如实写\"未记录\"，", "rows": [], "header": []}, {"h2": "2. 十个阶段各自怎么做", "h3": "③ 序列设计：一秒钟一条，批量出、按模型似然排序", "kind": "para", "text": "所以这一步的排序截断量必须由你自己的预算定，别以为原文给了标准答案。", "rows": [], "header": []}, {"h2": "2. 十个阶段各自怎么做", "h3": "④ 计算预筛（闸门 A）：这里决定成败，也最容易自欺", "kind": "para", "text": "主用判据（结构自洽性）：复合物 AF2 的 pAE_interaction < 10 且 af2_complex_rmsd < 5 Å（[B09]）。", "rows": [], "header": []}, {"h2": "2. 十个阶段各自怎么做", "h3": "④ 计算预筛（闸门 A）：这里决定成败，也最容易自欺", "kind": "para", "text": "为什么是它：同一篇论文做了对照实验——AF2 过滤库相对物理过滤库的成功率是 8×（LTK）与 30×（IL-2Rα site 1），", "rows": [], "header": []}, {"h2": "2. 十个阶段各自怎么做", "h3": "④ 计算预筛（闸门 A）：这里决定成败，也最容易自欺", "kind": "para", "text": "并且让物理法完全 0 命中的两个靶（ALK、IL-10Rα）拿到了命中；作者把失败归为 Type I（序列不折叠成设计态）", "rows": [], "header": []}, {"h2": "2. 十个阶段各自怎么做", "h3": "④ 计算预筛（闸门 A）：这里决定成败，也最容易自欺", "kind": "para", "text": "与 Type II（设计态本身不会结合），并指出 AF2/RF2 的表现说明 Type II 才是主因。", "rows": [], "header": []}, {"h2": "2. 十个阶段各自怎么做", "h3": "④ 计算预筛（闸门 A）：这里决定成败，也最容易自欺", "kind": "para", "text": "这套阈值是怎么来的，要如实说：[K31] 的切点（pTM 0.8、界面 pLDDT 84、IRAD −128、Rosetta 跨界面结合能 −16、ipTM≈0.75）", "rows": [], "header": []}, {"h2": "2. 十个阶段各自怎么做", "h3": "④ 计算预筛（闸门 A）：这里决定成败，也最容易自欺", "kind": "para", "text": "是在同一批 149 例上按 sensitivity+specificity 最大化拟合的，没有留出集；多分类 AUC 只有 0.77–0.84。", "rows": [], "header": []}, {"h2": "2. 十个阶段各自怎么做", "h3": "④ 计算预筛（闸门 A）：这里决定成败，也最容易自欺", "kind": "para", "text": "[K40] 也在同一口径下自己承 . 六个常见自欺（全部是从卡的 §2/§7 里沉淀出来的实测缺陷）", "h3": "", "kind": "para", "text": "---", "rows": [], "header": []}, {"h2": "6. 如果你只有 4 个湿实验构建体的预算（我们自己的处境）", "h3": "", "kind": "para", "text": "这一节是把上面的工作流收缩到我们的现实约束：不能建漏斗末端，只能优化末端之前的每一次判断。", "rows": [], "header": []}, {"h2": "6. 如果你只有 4 个湿实验构建体的预算（我们自己的处境）", "h3": "", "kind": "para", "text": "可迁移的做法：", "rows": [], "header": []}, {"h2": "6. 如果你只有 4 个湿实验构建体的预算（我们自己的处境）", "h3": "", "kind": "list", "items": ["把判断力花在\"候选是否可能有正确拓扑/界面\"上，用共识而不是单点阈值（[K33] 的共识比最好单工具 +0.15 ρ）。", "每道判断都留阴性对照锚点：[B22] 用 0%–2% 的靶证明判据失灵域存在；[K31] 的抗体子集 0/11 就是天然阴性锚。", "明确\"不配做重型确证\"的候选（[K27]：MD 每候选 200 ns 的账在百级就爆）。"], "rows": [], "header": []}, {"h2": "6. 如果你只有 4 个湿实验构建体的预算（我们自己的处境）", "h3": "", "kind": "para", "text": "不可迁移、也最容易被误用的东西（卡的 §8 逐条写死）：**binder 的 pAE/ipTM 阈值、适配体的 FEP 命中率、展示库通量、", "rows": [], "header": []}, {"h2": "6. 如果你只有 4 个湿实验构建体的预算（我们自己的处境）", "h3": "", "kind": "para", "text": "以及任何\"某法对未知体系成功率 X%\"的说法**，都不能当成我们（天然 UAA 合成酶发现）的判据或成功概率。", "rows": [], "header": []}, {"h2": "6. 如果你只有 4 个湿实验构建体的预算（我们自己的处境）", "h3": "", "kind": "para", "text": "那条主线现在由 A:\\Data\\DP2R\\方案 的判定标准管辖（2026-10-18 起：线性 5′-ppp-U-A-A-Nₙ-3′OH 目标、S0/S1/S2 化学事件、", "rows": [], "header": []}, {"h2": "6. 如果你只有 4 个湿实验构建体的预算（我们自己的处境）", "h3": "", "kind": "para", "text": "概率排序暂停、≤4 个湿实验构建体），本仓库只作为跨实验室的判据有效性与成本证据参考库，不作为那条主线的判定输入。", "rows": [], "header": []}, {"h2": "6. 如果你只有 4 个湿实验构建体的预算（我们自己的处境）", "h3": "", "kind": "para", "text": "---", "rows": [], "header": []}, {"h2": "7. 复现与文件清单", "h3": "", "kind": "para", "text": "cd A:\\Data\\MD\\projects\\protein-design-screening-20261016", "rows": [], "header": []}, {"h2": "7. 复现与文件清单", "h3": "", "kind": "para", "text": "# 1) 卡片完整性 + 逐字引句真实性（152/152 PASS 才算数）", "rows": [], "header": []}, {"h2": "7. 复现与文件清单", "h3": "", "kind": "para", "text": "set PYTHONIOENCODING=utf-8", "rows": [], "header": []}, {"h2": "7. 复现与文件清单", "h3": "", "kind": "para", "text": "python scripts/verify_literature_cards.py", "rows": [], "header": []}, {"h2": "7. 复现与文件清单", "h3": " ing the Efficiency of Ligand-Binding Protein Design with Molecular Dynamics Simulations", "年份": "2019", "期刊或预印本": "J. Chem. Theory Comput., 2019, 15:5703-5715", "底稿形态": "FULLTEXT", "文献类型": "论文（方法学/回顾性评估；不含新设计、不含新湿实验）", "计算筛选判据": "显式溶剂全原子 MD（apo+holo 双态）的 10 个动力学指纹：Cα 聚类簇数 NOC、疏水残基 SASA、POVME 腔体积、apo 中体积低于 30 Å3 的帧数、holo 平均腔体积、配体 RMSD、蛋白-配体氢键数、腔内水数、水存活概率、设计残基 χ1；下游接 PCA+k-means（无监督 S/U/F 三簇）与 k-NN/逻辑回归（有监督，5 折交叉验证 + 跨骨架留出）", "阈值数字": "采样长度约 500 ns、3-4 重复（收敛判据为经验结论，原文未给量化阈值）；聚类 RMSD cutoff 1.5 Å；塌陷体积阈值 30 Å3（依据 holo 最小观测 33 Å3）；氢键几何 强 1.2-1.5 Å 且 170-180°、中等 1.5-2.2 Å 且 130-170°；k-means 取 3 簇（平均 silhouette 0.45）；PCA 前 3 主成分解释 80% 方差；逻辑回归 tolerance 1e-4 liblinear、k-NN k=2 或 5 均匀权重欧氏距离；pH 7 赋态、150 mM NaCl、非键截断 10 Å、2 fs + SHAKE、最小化 13,000 cycles；疏水 SASA 约 0.29 nm2 仅为作者 suggested 经验线（未进分类器）", "候选数递减": "37 个设计（4 DIG + 33 β-barrel，Table 1 共 39 个模拟条目）→ 无监督 33 条分入 F 簇 12 / U 簇 6 / S 簇（含 4 条误分、0 条假阴）→ 有监督 joint 37 条 5 折交叉验证 → 跨骨架：β-barrel 训练(70:30) 测 4 条 DIG、反向 DIG 训练测 33 条 β-barrel", "实验命中率": "回顾性、非前瞻：无监督在 33 条上 88% accuracy；用于 24 条一代设计筛选会得 2 真阳 + 4 假阳（绝对命中率 2/6，富集 ((2/6)/(2/24)) = 4 倍）；有监督逻辑回归 accuracy 0.93±0.10、precision 0.87±0.17、recall 1.0、MCC 0.87±0.16、F1 0.92±0.10；k-NN 0.84±0.16/0.79±0.21/1.0/0.74±0.25/0.87±0.13；β-barrel 训练→DIG(4 条) 测试 acc 1.0；DIG 训练→β-barrel 测试 acc 0.70、precision 0.52、recall 1.0；本文未报告\"被 MD 判死的候选里有多少是真阳性\"这一反向指标", "成本/统计": "作者自估：提前剔除 F(12)+U(6) 共 18 条可省约 6 周湿实验（明称 low-bound 估计，他实验室需 2-3 倍）；MD 准备-模拟-分析在并行 GPU 上 <2 周、Kepler 工作流自动化；全文未给 GPU 型号、卡时数或金钱成本任何一项；分类指标为均值±标准差且方差与均值同量级（如 0.84±0.16），交叉验证在 37 条上功效不足", "精读卡文件": "data/literature_cards/B02_Barros-2019_JCTC_md-screening-ligand-binders.md", "人物组": "Baker组"}, "B03": {"id": "B03", "标题": "De novo protein design by deep network hallucination", "年份": "2021", "期刊或预印本": "Nature, 2021, 600:547-552", "底稿形态": "FULLTEXT", "文献类型": "论文", "计算筛选判据": "KL(P_trRosetta 对 Q_background) 对比度为主目标；氨基酸组成相对 PDB 的负 KL 为约束项；TM-score 层次聚类去冗余；簇内 score = KL 对比度 + 交叉熵差（幻觉结构对网络预测分布的贴合度）；Rosetta ab initio 折叠漏斗做正交复核（明确不参与生成与下单挑选）；人工目检剔除内部 ing–based protein sequence design using ProteinMPNN", "年份": "2022", "期刊或预印本": "Science, 2022, 378:49-56", "底稿形态": "FULLTEXT", "文献类型": "方法（deep learning 反折叠序列设计 + 跨体系架构扩展 + 失败设计救援的实验验证）", "计算筛选判据": "模型给出的序列平均对数概率（NLL，给定结构下的序列似然）用于批量排序送测；in silico 评估用 native sequence recovery（按埋藏度分档）与单序列 AlphaFold 复现骨架程度（lDDT-Ca 90/95 计数）；训练集筛选为分辨率/链长/聚类去冗余（物理能量项不作为闸口）", "阈值数字": "训练集 <3.5 Å 分辨率、<10,000 残基、mmseqs2 30% 一致性聚类（25,361 簇）；邻域 32-48 最近 Ca 饱和；相对位置编码 ±32；训练噪声 std=0.02 Å 与 0.3 Å 档；评估用 AF 模型 average pLDDT>80.0、lDDT-Ca 95.0/90.0；NLL 排序的\"取前 N 条\"阈值=未记录（正文未给）；采样温度数值阈值=未记录（正文只给趋势）", "候选数递减": "AF 幻觉骨架集 N=129：先用 AF 自序试表达 150 个蛋白（大多不溶，中位 9 mg/L）→ 同批骨架换 MPNN 序列下单 96 个设计 → 73 个可溶表达（中位 247 mg/L）→ 50 个为目标单体/寡聚态（SEC）；C5/C6 环寡聚体：Rosetta 序列 40% 可溶且 0 条寡聚态正确 → MPNN 序列 88% 可溶、27.7% 寡聚态正确；四面体颗粒：76 条序列覆盖 27 个骨架（每亚基 12 copies 耦合）→ 13 个形成预期 ~1 MDa 组装；in silico 集：402 单体对拍、690 monomers/732 homomers/98 heteromers 分层测试、396 个天然结构全重设计、NTF2 旧设计 3,000 骨架重设", "实验命中率": "天然骨架回收率 52.4%（MPNN）vs 32.9%（Rosetta）；救援实验成功率：AF 骨架集 73/96 可溶（76%）、50/96 目标寡聚态（52%）；环寡聚体 27.7% 寡聚态正确（对照 Rosetta 0%）；纳米颗粒 13/27 骨架成功组装（作者明说总体成功率与 Rosetta 原研究相当，收益在自动化与免人工干预）", "成本/统计": "1.2 秒 vs 4.3 分钟（100 残基，出序列）；结论段另一口径 1.2 sec vs 258.8 sec（单 CPU、100 残基）；全自动 ~1 秒/骨架；旧纳米颗粒流程含 Rosetta 设计后 >1 周人工修正；模型参数 1.381→1.678 mln；样本量偏小（96/27/13），比例类结论的置信区间宽", "精读卡文件": "data/literature_cards/B05_Dauparas-2022_Science_ProteinMPNN.md", "人物组": "Baker组; 通用方法学"}, "B06": {"id": "B06", "标题": "Design of protein-binding proteins from the target structure alone", "年份": "2022", "期刊或预印本": "Nature, 2022, 605:551-560", "底稿形态": "FULLTEXT", "文献类型": "论文（同一篇论文在 CSV 里以 B06（Baker组）与 C02（曹龙兴组）双重登记）", "计算筛选判据": "Rosetta ddG；contact molecular surface（自造，三角面元按对面最近距离指数降权求和）；shape complementarity；界面埋藏 SASA；埋藏不饱和极性原子（打包前排除不可成氢键 rotamer + 可分解伪能量惩罚）；结构序列 profile 兼容性；跨界面相互作用 upweight；Predictor 快速预筛（仅疏水氨基酸、限制 rotamer、禁用 fa_elec 与 lk_ball 系列与 _intra_ 项，最小化两次）并以\"各过滤器通过概率连乘\"（sigmoid 拟合 + 类逻辑回归 MLE）排序；骨架侧另有\"结构度量可预测折叠\"与稳定性预筛", "阈值数字": "正文未给单一数值化的设计闸口，判据以\"每个过滤器各自设 goal threshold 再连乘通过概率\"       '<div class="kv para">全文见 deliverables/frontier_methods_2025_2026.md 的 S 节。</div>';
  } else if(l){
    h='<h4>['+id+'] 库内行</h4><div class="kv"><b>'+esc(l["标题"])+'</b><br><span class="para">'+
      esc(l["年份"])+" · "+esc(l["期刊或预印本"])+" · "+esc(l["人物组"])+" · "+esc(l["底稿形态"])+" · "+esc(l["文献类型"])+"</span></div>"+
      '<div class="kv"><div class="lab">计算筛选判据</div>'+esc(l["计算筛选判据"])+"</div>"+
      '<div class="kv"><div class="lab">阈值原文</div>'+esc(l["阈值数字"])+"</div>"+
      '<div class="kv"><div class="lab">候选递减</div>'+esc(l["候选数递减"])+"</div>"+
      '<div class="kv"><div class="lab">实验命中率（含分母）</div>'+esc(l["实验命中率"])+"</div>"+
      '<div class="kv"><div class="lab">成本／统计</div>'+esc(l["成本/统计"])+"</div>"+
      '<div class="kv"><div class="lab">精读卡</div>'+esc(l["精读卡文件"])+"</div>";
  } else {
    h='<h4>['+id+'] 台账里查不到</h4><div class="kv para">这条引用没有对应记录——正是审核要找的问题之一。</div>';
  }
  el.innerHTML='<button class="close" onclick="document.getElementById(\'drawer\').classList.remove(\'open\')">关闭</button>'+h;
  el.classList.add("open");
}
function refresh(){
  const tab=D.tabs.find(t=>t.key===tabKey);
  document.getElementById("content").innerHTML=blockHtml(tab);
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.k===tabKey));
  const ids=Object.keys(marks);
  const cnt={keep:0,doubt:0,change:0};ids.forEach(i=>cnt[marks[i]]++);
  document.getElementById("stat").innerHTML='本模板阈值条目 <span class="count">'+D.counts.thresholds+
    '</span> 行 · 引用 <span class="count">'+D.counts.cites+'</span> 处（台账查不到 <span class="count">'+D.counts.missing+
    '</span> 处）· 已标：保留 '+cnt.keep+" · 存疑 "+cnt.doubt+" · 要改 "+cnt.change;
}
function report(){
  const lines=[];
  for(const t of D.tabs){
    let idx=0;
    for(const b of t.blocks){
      for(const r of b.rows){
        const id=t.key+"#"+idx++;
        if(!marks[id]&&!notes[id]) continue;
        const head=b.h3||b.h2||t.title;
        lines.push("- **["+t.title+"｜"+esc(head)+"]** "+(marks[id]==="change"?"要改":marks[id]==="doubt"?"存疑":"保留")+
          "：`"+r.cells[0]+"`"+(notes[id]?(" —— "+notes[id]):""));
      }
    }
  }
  document.getElementById("out").textContent=lines.length?lines.join("\n"):"（还没有任何标记或批注；先在行上点“要改／存疑”或写批注）";
  return lines;
}
function wire(){
  document.addEventListener("click",e=>{
    const t=e.target;
    if(t.classList.contains("cite")){openCite(t.dataset.c);return;}
    if(t.dataset.m){const id=t.dataset.id;marks[id]=marks[id]===t.dataset.m?"":t.dataset.m;refresh();return;}
    if(t.id==="btabs")return;
  });
  document.addEventListener("input",e=>{if(e.target.dataset.n!==undefined){notes[e.target.dataset.n]=e.target.value;}});
  document.getElementById("tabs").addEventListener("click",e=>{if(e.target.dataset.k){tabKey=e.target.dataset.k;refresh();}});
  document.getElementById("btn-report").onclick=()=>{report();document.getElementById("outbox").style.display="block";};
  document.getElementById("btn-copy").onclick=async()=>{
    const txt=report().join("\n");if(!txt)return;
    try{await navigator.clipboard.writeText(txt);document.getElementById("btn-copy").textContent="已复制";}
    catch(err){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();document.getElementById("btn-copy").textContent="已复制";}
    setTimeout(()=>document.getElementById("btn-copy").textContent="复制审核意见",1500);
  };
  document.getElementById("btn-clear").onclick=()=>{Object.keys(marks).forEach(k=>delete marks[k]);Object.keys(notes).forEach(k=>delete notes[k]);refresh();};
  document.getElementById("drawer").addEventListener("click",e=>{if(e.target.id==="drawer")e.target.classList.remove("open");});
}
wire();refresh();
</script>
